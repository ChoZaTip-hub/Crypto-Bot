services:
  - type: web
    name: crypto-bot
    runtime: python
    plan: starter
    buildCommand: pip install -e . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-bot-db
          property: connectionString
      - key: TRADING_MODE
        value: paper
      - key: BOT_AUTO_START
        value: true
      - key: BACKGROUND_SERVICES_ENABLED
        value: true
      - key: SCANNER_ENABLED
        value: true
      - key: API_ADMIN_TOKEN
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: crypto-bot-db
    plan: basic-256mb
    postgresMajorVersion: "16"
